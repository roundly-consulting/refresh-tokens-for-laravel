name: run-tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: [8.4]
        laravel: [12.*, 13.*]
        stability: [prefer-stable]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    # No Postgres service here any more: this job is the sqlite + coverage leg, and the
    # real engine now has its own whole-suite job below. Provisioning a database this leg
    # never connects to was pure cost.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pgsql, pdo_pgsql, bcmath, soap, intl, fileinfo
          coverage: pcov

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Audit dependencies for known vulnerabilities
        run: composer audit

      - name: Execute tests (sqlite + coverage gate)
        run: vendor/bin/pest --coverage --min=95

  test-pgsql:
    runs-on: ubuntu-latest
    name: P8.4 - pgsql real-engine

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pgsql, pdo_pgsql, bcmath, soap, intl, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute tests against postgres
        env:
          # Replaces this package's bespoke PG_USERNAME/PG_PASSWORD convention and its
          # targeted `pest --group=concurrency-pgsql` lane, on the fleet's evidence:
          #
          #  - the old lane gated on `getenv('REFRESH_TOKENS_PG') === '1'` — whether an env
          #    var was SET, never whether an engine was REACHABLE, so a leg that lost its
          #    service still reported green;
          #  - it ran raw SQL, never the package's own redeem() path;
          #  - and a lane only ever runs what someone remembered to tag. The shops pilot's
          #    real find surfaced in an ordinary domain test nobody would have tagged, and
          #    the lane's cost argument evaporates once the leg runs in parallel with the
          #    sqlite matrix.
          #
          # TESTING_DB_DRIVER is what moves the suite off sqlite. The location vars alone
          # only say where the engine is: without the driver this job would run every test
          # on sqlite and call itself a postgres leg.
          TESTING_DB_DRIVER: pgsql
          TESTING_DB_HOST: 127.0.0.1
          TESTING_DB_PORT: 5432
          TESTING_DB_DATABASE: testing
          TESTING_DB_USERNAME: testing
          TESTING_DB_PASSWORD: secret
        # Coverage is enforced on the sqlite matrix; this is a correctness leg, and
        # re-measuring it doubles the slowest job for no signal.
        run: vendor/bin/pest --ci
